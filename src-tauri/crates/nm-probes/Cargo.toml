[package]
name = "nm-probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Probe engine for Network Monitor: probers, scheduling, timeout and rate policy."

[features]
# Opt-in tests that send real traffic. Off by default so the offline suite stays
# deterministic; CI and developers run them deliberately.
network-tests = []

[dependencies]
nm-core.workspace = true
nm-platform.workspace = true
thiserror.workspace = true

# The fallback chain holds probers of different kinds behind one interface, which needs a
# `dyn`-safe async trait. Native `async fn` in traits is not object-safe, and this crate
# is the standard, minimal way to bridge that gap.
async-trait = "0.1"

# `net` for the TCP prober's socket, `time` for probe deadlines, `rt` to move the blocking
# ICMP call off the runtime's worker threads, `sync` + `macros` for the runner's command
# channel and its `select!`. No `rt-multi-thread`: the runtime itself is `nm-app`'s to own.
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
mockall.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
