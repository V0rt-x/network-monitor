[package]
name = "nm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tauri application layer for Network Monitor: commands, events, state and tray."

[lib]
# Desktop-only: the `staticlib`/`cdylib` pair the Tauri template ships exists for mobile
# targets, and on Windows it makes the unit-test binary load a DLL it cannot resolve.
name = "nm_app"
# Tests live in `tests/` instead of `#[cfg(test)]` modules — see `tests.manifest` for
# why in-crate test harnesses cannot start on Windows.
test = false

[[bin]]
name = "nm-app"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nm-core.workspace = true
nm-platform.workspace = true
nm-probes.workspace = true
thiserror.workspace = true

# The bundled autonomous-system directory ships gzip-compressed: 5.1 MB in the installer
# against 45 MB of plain text. Already in the dependency tree through Tauri, so it costs
# a direct entry here and no new code to audit; `miniz_oxide` underneath it is pure Rust,
# which keeps the build free of a C toolchain.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
# Target lists and the settings file are JSON; this is the only crate that reads either.
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri = { version = "2", features = ["tray-icon"] }
# Official Tauri plugins, both required by Phase 3's shell: a second launch must reach the
# running instance rather than start a second set of probes, and "start with Windows" must
# not mean writing to the registry from a crate that forbids `unsafe` and platform `cfg`s.
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# `net` for the system resolver used on baseline host names, `sync` for the watch/mpsc
# channels the tasks talk over, `rt` for the blocking pool the debounced writer uses.
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true
